name: R-CMD-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: '4.5'}
          - {os: ubuntu-latest, r: '4.6'}
    env:
      R_REMOTES_UPGRADE: never
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # 'webshot2' is deliberately not installed here: it pulls in a
          # Chromium system package, which made every run slow and dependent on
          # apt availability. PNG export needs a browser by definition, so the
          # test for it skips when no renderer is present, and CI covers the
          # HTML export path instead.
          extra-packages: any::rcmdcheck, any::testthat, any::BiocStyle, any::limma, any::org.Hs.eg.db, any::TxDb.Hsapiens.UCSC.hg19.knownGene, any::RankProd
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          # The vignette PDFs embed figures; without compacting them at build
          # time the check reports that 'gs+qpdf' could still shrink them.
          build_args: 'c("--no-manual", "--compact-vignettes=both")'
        env:
          _R_CHECK_CRAN_INCOMING_: false
